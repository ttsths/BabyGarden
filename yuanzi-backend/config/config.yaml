# Yuanzi 后端配置文件
# 环境: 开发/测试

server:
  run_mode: debug
  http_port: 8080
  read_timeout: 60
  write_timeout: 60

database:
  type: mysql
  host: 121.43.54.203
  port: 3306
  user: root
  password: ""
  name: yuanzi
  table_prefix: ""
  max_idle_conn: 20
  max_open_conn: 100

redis:
  host: 121.43.54.203
  port: 31379
  password: ""
  database: 1

jwt:
  secret: ""
  expire_duration: 2h
  refresh_days: 7

oss:
  region: cn-hangzhou
  bucket: yuanzi-bucket
  access_key_id: ""
  access_key_secret: ""
  cdn_domain: ""
  callback_secret: ""

sms:
  access_key_id: ""
  access_key_secret: ""
  sign_name: ""
  template_code: ""

ai:
  provider_chain:
    - grokai
    - cloudflare_workers_ai
    - dashscope
    - cliproxyapi
  timeout_seconds: 45
  max_retries_per_provider: 1
  enable_fallback: true

  safety:
    system_prompt: "你是 BabyGarden 的育儿助手。你可以提供通用育儿知识、生活护理建议、成长记录整理、亲子互动建议。你不能进行医疗诊断，不能替代医生。涉及发热、呼吸困难、抽搐、误食、严重过敏、脱水、持续呕吐、婴儿精神萎靡、用药剂量等问题时，必须建议用户及时咨询儿科医生或急诊。回答要简洁、谨慎、可执行。"
    max_prompt_chars: 12000
    max_output_tokens: 1200

  quota:
    redis_prefix: "babygarden:ai"
    per_user_daily_limit: 50
    per_family_daily_limit: 200

  # GrokAI — 通过环境变量覆盖敏感字段:
  #   AI_GROKAI_ENABLED, AI_GROKAI_BASE_URL, AI_GROKAI_API_KEY, AI_GROKAI_MODEL
  grokai:
    enabled: false
    base_url: ""
    api_key: ""
    model: "grok-4.1-fast"
    timeout_seconds: 45

  # Cloudflare Workers AI — 通过环境变量覆盖敏感字段:
  #   AI_CLOUDFLARE_ENABLED, AI_CLOUDFLARE_ACCOUNT_ID, AI_CLOUDFLARE_API_TOKEN,
  #   AI_CLOUDFLARE_GATEWAY_ID, AI_CLOUDFLARE_USE_GATEWAY, AI_CLOUDFLARE_MODEL
  cloudflare:
    enabled: false
    account_id: ""
    api_token: ""
    gateway_id: ""
    use_gateway: false
    model: "@cf/moonshotai/kimi-k2.6"
    daily_neuron_budget: 9000
    hard_neuron_budget: 9800
    timeout_seconds: 45
    cache_ttl_seconds: 300

  # DashScope — 通过环境变量覆盖敏感字段:
  #   AI_DASHSCOPE_ENABLED, AI_DASHSCOPE_API_KEY, AI_DASHSCOPE_MODEL
  dashscope:
    enabled: true
    api_key: ""
    model: "qwen-plus"
    timeout_seconds: 45

  # CLIProxyAPI — 通过环境变量覆盖敏感字段:
  #   AI_CLIPROXYAPI_ENABLED, AI_CLIPROXYAPI_BASE_URL, AI_CLIPROXYAPI_API_KEY, AI_CLIPROXYAPI_MODEL
  cliproxyapi:
    enabled: false
    base_url: ""
    api_key: ""
    model: "gpt-5.5"
    timeout_seconds: 60

  # 旧字段（保留兼容）
  dashscope_api_key: ""
  nls_app_key: ""
  nls_endpoint: ""
  nls_access_key_id: ""
  nls_access_key_secret: ""

push:
  apns:
    team_id: ""
    key_id: ""
    bundle_id: ""
    key_path: ""
    use_sandbox: true
    timeout_seconds: 10

