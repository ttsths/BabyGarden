version: '3.8'

services:
  mysql:
    image: mysql:8.0.32
    container_name: yuanzi-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: yuanzi
      MYSQL_USER: yuanzi
      MYSQL_PASSWORD: yuanzi123
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./config/mysql/init:/docker-entrypoint-initdb.d
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: yuanzi-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  app:
    build: .
    container_name: yuanzi-api
    restart: always
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=root:rootpassword@tcp(mysql:3306)/yuanzi?charset=utf8mb4&parseTime=True&loc=Local
      - REDIS_URL=redis://redis:6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./config/config.yaml:/app/config/config.yaml
      - ./logs:/app/logs

volumes:
  mysql_data:
  redis_data:
