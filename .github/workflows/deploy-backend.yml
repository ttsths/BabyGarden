name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'yuanzi-backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  # ============================================================
  # Job 1: Test
  # ============================================================
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: yuanzi-backend/go.sum

      - name: Run tests
        working-directory: yuanzi-backend
        run: go test ./... -v

  # ============================================================
  # Job 2: Deploy to Cloudflare Containers
  # ============================================================
  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Worker dependencies
        working-directory: yuanzi-backend
        run: npm install

      - name: Deploy to Cloudflare Containers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: yuanzi-backend
          wranglerVersion: '4'
          command: deploy
