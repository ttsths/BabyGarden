name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'yuanzi-backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  # ============================================================
  # Job 1: Test
  # ============================================================
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: yuanzi-backend/go.sum

      - name: Run tests (skip Redis - no server in CI)
        working-directory: yuanzi-backend
        run: go test $(go list ./... | grep -v gredis) -v

  # ============================================================
  # Job 2: Deploy to Cloudflare Containers
  # ============================================================
  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Worker dependencies
        working-directory: yuanzi-backend
        run: npm install

      - name: Inject R2 secrets into wrangler.toml
        working-directory: yuanzi-backend
        run: |
          cat >> wrangler.toml << 'EOF'
          R2_ACCESS_KEY_ID = "${{ secrets.R2_ACCESS_KEY_ID }}"
          R2_ACCESS_KEY_SECRET = "${{ secrets.R2_ACCESS_KEY_SECRET }}"
          EOF

      - name: Inject AI secrets into wrangler.toml
        working-directory: yuanzi-backend
        run: |
          cat >> wrangler.toml << 'ENVEOF'
          # ---- AI Provider 环境变量（CI 注入）----
          AI_GROKAI_ENABLED = "true"
          AI_GROKAI_BASE_URL = "https://grok2api.shentuhaisan.workers.dev/"
          AI_GROKAI_API_KEY = "${{ secrets.AI_GROKAI_API_KEY }}"
          AI_GROKAI_MODEL = "grok-4.1-fast"
          AI_CLOUDFLARE_ENABLED = "true"
          AI_CLOUDFLARE_ACCOUNT_ID = "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
          AI_CLOUDFLARE_API_TOKEN = "${{ secrets.AI_CLOUDFLARE_API_TOKEN }}"
          AI_CLOUDFLARE_GATEWAY_ID = "yuanzi-ai-gateway"
          AI_CLOUDFLARE_USE_GATEWAY = "false"
          AI_CLOUDFLARE_MODEL = "@cf/moonshotai/kimi-k2.6"
          AI_DASHSCOPE_ENABLED = "true"
          AI_DASHSCOPE_API_KEY = "${{ secrets.AI_DASHSCOPE_API_KEY }}"
          AI_DASHSCOPE_MODEL = "qwen-plus"
          ENVEOF

      - name: Deploy to Cloudflare Containers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: yuanzi-backend
          wranglerVersion: '4'
          command: deploy

      - name: Notify Telegram
        if: success()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="Markdown" \
            -d text="🚀 *Backend 部署完成*%0A%0A📦 Commit: \`${GITHUB_SHA:0:7}\`%0A🔗 ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}%0A🌐 https://yuanzi-backend.shentuhaisan.workers.dev"
