name: Code Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'yuanzi-backend/**'
      - 'yuanzi-frontend/**'

jobs:
  # ============================================================
  # 后端: Go Lint + Test
  # ============================================================
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: yuanzi-backend/go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          working-directory: yuanzi-backend
          version: latest
          args: --timeout=5m

      - name: go vet
        working-directory: yuanzi-backend
        run: go vet ./...

      - name: go test
        working-directory: yuanzi-backend
        run: go test ./... -v -count=1

  # ============================================================
  # 前端: ESLint + TypeScript Check + Test
  # ============================================================
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: yuanzi-frontend/package-lock.json

      - name: Install dependencies
        working-directory: yuanzi-frontend
        run: npm ci

      - name: ESLint
        working-directory: yuanzi-frontend
        run: npx eslint src/ --max-warnings 0

      - name: TypeScript check
        working-directory: yuanzi-frontend
        run: npx tsc --noEmit

      - name: Build check
        working-directory: yuanzi-frontend
        run: npm run build
