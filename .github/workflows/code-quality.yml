name: Code Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'yuanzi-backend/**'
      - 'yuanzi-frontend/**'

jobs:
  # ============================================================
  # 后端: Go Lint + Test
  # ============================================================
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: yuanzi-backend/go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          working-directory: yuanzi-backend
          version: latest
          args: --timeout=5m

      - name: go vet
        working-directory: yuanzi-backend
        run: go vet ./...

      - name: go test with coverage
        working-directory: yuanzi-backend
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_ACCESS_KEY_SECRET: ${{ secrets.R2_ACCESS_KEY_SECRET }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        run: go test ./... -v -count=1 -coverprofile=coverage.out -covermode=atomic

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: yuanzi-backend/coverage.out
          flags: backend
          fail_ci_if_error: false

  # ============================================================
  # 前端: ESLint + TypeScript Check
  # ============================================================
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: yuanzi-frontend/package-lock.json

      - name: Install dependencies
        working-directory: yuanzi-frontend
        run: npm ci

      - name: ESLint
        working-directory: yuanzi-frontend
        run: npx eslint src/ --max-warnings 0

      - name: TypeScript check
        working-directory: yuanzi-frontend
        run: npx tsc --noEmit

      - name: Build check
        working-directory: yuanzi-frontend
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || '/api/v1' }}
          VITE_R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        run: npm run build
