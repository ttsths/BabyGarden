<!DOCTYPE html>

<html class="light" lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>BabyGarden - 建立你的家庭</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-tertiary-container": "#f6fffa",
                        "tertiary-container": "#4d7e71",
                        "surface-container-lowest": "#ffffff",
                        "quiet-border": "#E7D8D2",
                        "inverse-surface": "#31302e",
                        "secondary": "#97463b",
                        "secondary-fixed-dim": "#ffb4a8",
                        "outline": "#8b716e",
                        "on-error-container": "#93000a",
                        "surface-container-low": "#f7f3ef",
                        "on-primary-fixed": "#410002",
                        "on-error": "#ffffff",
                        "inverse-on-surface": "#f4f0ec",
                        "primary-container": "#c84b42",
                        "primary-fixed": "#ffdad6",
                        "deep-cocoa": "#23110F",
                        "tertiary-fixed-dim": "#9ed1c2",
                        "surface-tint": "#aa352e",
                        "surface-dim": "#ddd9d6",
                        "error": "#ba1a1a",
                        "surface-container-highest": "#e5e2de",
                        "inverse-primary": "#ffb4ab",
                        "on-primary-fixed-variant": "#891d1a",
                        "surface-container": "#f1ede9",
                        "surface-variant": "#e5e2de",
                        "background": "#fdf9f5",
                        "on-secondary-fixed": "#3e0402",
                        "outline-variant": "#dfbfbb",
                        "tertiary-fixed": "#b9edde",
                        "surface": "#fdf9f5",
                        "secondary-fixed": "#ffdad5",
                        "on-secondary": "#ffffff",
                        "on-background": "#1c1c19",
                        "focus-blue": "#2E90FA",
                        "slate-graphite": "#344054",
                        "primary-fixed-dim": "#ffb4ab",
                        "on-tertiary": "#ffffff",
                        "on-primary": "#ffffff",
                        "surface-bright": "#fdf9f5",
                        "on-tertiary-fixed": "#00201a",
                        "on-primary-container": "#fffcff",
                        "secondary-container": "#fe9889",
                        "surface-container-high": "#ebe7e4",
                        "error-container": "#ffdad6",
                        "on-tertiary-fixed-variant": "#1d4f44",
                        "on-secondary-fixed-variant": "#792f26",
                        "on-surface-variant": "#58413f",
                        "primary": "#a7332c",
                        "tertiary": "#346559",
                        "on-secondary-container": "#772e24",
                        "on-surface": "#1c1c19"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "product-gutter": "16px",
                        "admin-margin": "16px",
                        "admin-control-height": "36px",
                        "control-min-height": "44px",
                        "product-margin": "24px",
                        "admin-gutter": "8px"
                    },
                    "fontFamily": {
                        "headline-lg-mobile": ["Noto Sans SC", "sans-serif"],
                        "headline-lg": ["Noto Sans SC", "sans-serif"],
                        "section-title": ["Noto Sans SC", "sans-serif"],
                        "product-body": ["Noto Sans SC", "sans-serif"],
                        "supporting-text": ["Noto Sans SC", "sans-serif"],
                        "label-caps": ["Noto Sans SC", "sans-serif"]
                    },
                    "fontSize": {
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "600" }],
                        "section-title": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "product-body": ["16px", { "lineHeight": "26px", "fontWeight": "400" }],
                        "supporting-text": ["14px", { "lineHeight": "22px", "fontWeight": "400" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700" }]
                    }
                },
            },
        }
    </script>
<style>
        body {
            background-color: #FFFBF7; /* Warm Porcelain */
        }
        .form-input-focus:focus-within {
            box-shadow: 0 0 0 2px #FFFBF7, 0 0 0 4px #2E90FA; /* focus-blue with background spacer */
        }
        input[type="radio"]:checked + div {
            background-color: #f7f3ef; /* surface-container-low */
            border-color: #8b716e; /* outline */
            color: #23110F; /* deep-cocoa */
            font-weight: 600;
        }
        .segmented-control-label:has(input[type="radio"]:checked) {
             background-color: #f7f3ef;
             border-color: #8b716e;
             color: #23110F;
             font-weight: 600;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-product-body text-on-surface min-h-screen flex flex-col items-center">
<!-- Top Navigation (Onboarding Mode - No Nav Links, Transactional) -->
<header class="w-full top-0 sticky bg-surface border-b border-quiet-border flat no shadows z-50">
<div class="flex justify-between items-center h-control-min-height px-product-gutter max-w-[1440px] mx-auto w-full max-w-[390px] md:max-w-md">
<span class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary">BabyGarden</span>
<div class="flex items-center gap-2">
<span class="font-supporting-text text-supporting-text text-on-surface-variant">第 1 步，共 1 步</span>
<div class="w-8 h-8 rounded-full bg-surface-container flex items-center justify-center border border-quiet-border overflow-hidden">
<span class="material-symbols-outlined text-on-surface-variant text-sm" style="font-variation-settings: 'FILL' 1;">person</span>
</div>
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="w-full max-w-[390px] md:max-w-md mx-auto px-product-gutter py-product-margin flex-1 flex flex-col">
<!-- Onboarding Form Card -->
<div class="bg-surface-container-lowest rounded-[16px] border border-quiet-border p-6 shadow-sm flex flex-col gap-8">
<!-- Header Section -->
<div class="flex flex-col gap-2">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-deep-cocoa">先认识一下你的家庭</h1>
<p class="font-supporting-text text-supporting-text text-on-surface-variant">只需几步即可开启记录宝宝成长的旅程</p>
</div>
<!-- Form Content -->
<form class="flex flex-col gap-6">
<!-- Section 1: Family Info -->
<fieldset class="flex flex-col gap-4 border-0 p-0 m-0">
<legend class="font-section-title text-section-title text-deep-cocoa mb-4">家庭信息</legend>
<div class="flex flex-col gap-1.5 group form-input-focus rounded">
<label class="font-supporting-text text-supporting-text text-deep-cocoa font-medium" for="familyName">家庭名称</label>
<input class="w-full h-control-min-height px-4 border border-quiet-border rounded-[8px] bg-surface-container-lowest text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none focus:ring-0 transition-shadow" id="familyName" name="familyName" placeholder="例如: 圆子的家" type="text"/>
</div>
<div class="flex flex-col gap-1.5 group form-input-focus rounded">
<label class="font-supporting-text text-supporting-text text-deep-cocoa font-medium" for="userRole">你的称呼</label>
<input class="w-full h-control-min-height px-4 border border-quiet-border rounded-[8px] bg-surface-container-lowest text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none focus:ring-0 transition-shadow" id="userRole" name="userRole" placeholder="例如: 妈妈、爸爸" type="text"/>
</div>
</fieldset>
<!-- Section 2: Baby Info -->
<fieldset class="flex flex-col gap-4 border-0 p-0 m-0 pt-4 border-t border-quiet-border">
<legend class="font-section-title text-section-title text-deep-cocoa mb-4">宝宝信息</legend>
<div class="flex flex-col gap-1.5 group form-input-focus rounded">
<label class="font-supporting-text text-supporting-text text-deep-cocoa font-medium" for="babyName">宝宝姓名或小名</label>
<input class="w-full h-control-min-height px-4 border border-quiet-border rounded-[8px] bg-surface-container-lowest text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none focus:ring-0 transition-shadow" id="babyName" name="babyName" placeholder="输入宝宝姓名" type="text"/>
<!-- Error state example hidden by default -->
<span class="hidden font-supporting-text text-[12px] text-error mt-1">姓名不能为空</span>
</div>
<div class="flex flex-col gap-1.5 group form-input-focus rounded">
<label class="font-supporting-text text-supporting-text text-deep-cocoa font-medium" for="babyDob">出生日期</label>
<div class="relative w-full">
<input class="w-full h-control-min-height pl-4 pr-10 border border-quiet-border rounded-[8px] bg-surface-container-lowest text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none focus:ring-0 transition-shadow appearance-none" id="babyDob" name="babyDob" type="date"/>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">calendar_today</span>
</div>
<span class="font-supporting-text text-[12px] text-on-surface-variant mt-1">格式: YYYY/MM/DD (也可稍后填写)</span>
</div>
<div class="flex flex-col gap-1.5">
<span class="font-supporting-text text-supporting-text text-deep-cocoa font-medium">宝宝性别</span>
<div class="flex w-full bg-surface-container-low p-1 rounded-[10px] border border-quiet-border gap-1">
<label class="flex-1 relative cursor-pointer group segmented-control-label rounded-[6px] border border-transparent transition-colors">
<input class="sr-only" name="babyGender" type="radio" value="boy"/>
<div class="flex items-center justify-center h-10 text-on-surface-variant font-supporting-text text-supporting-text group-hover:bg-surface-container transition-colors rounded-[6px]">
                                    男宝宝
                                </div>
</label>
<label class="flex-1 relative cursor-pointer group segmented-control-label rounded-[6px] border border-transparent transition-colors">
<input class="sr-only" name="babyGender" type="radio" value="girl"/>
<div class="flex items-center justify-center h-10 text-on-surface-variant font-supporting-text text-supporting-text group-hover:bg-surface-container transition-colors rounded-[6px]">
                                    女宝宝
                                </div>
</label>
<label class="flex-1 relative cursor-pointer group segmented-control-label rounded-[6px] border border-transparent transition-colors">
<input checked="" class="sr-only" name="babyGender" type="radio" value="unknown"/>
<div class="flex items-center justify-center h-10 text-on-surface-variant font-supporting-text text-supporting-text group-hover:bg-surface-container transition-colors rounded-[6px]">
                                    暂不选择
                                </div>
</label>
</div>
</div>
</fieldset>
<!-- Actions -->
<div class="flex flex-col gap-4 mt-4">
<button class="w-full h-control-min-height bg-primary-container text-on-primary rounded-[12px] font-product-body text-product-body font-medium hover:bg-primary transition-colors focus:outline-none focus:ring-2 focus:ring-focus-blue focus:ring-offset-2 focus:ring-offset-background active:bg-primary-fixed-variant" type="submit">
                        创建家庭并继续
                    </button>
<button class="w-full h-control-min-height bg-transparent text-on-surface-variant rounded-[12px] font-product-body text-product-body hover:bg-surface-container transition-colors focus:outline-none focus:ring-2 focus:ring-focus-blue focus:ring-offset-2 focus:ring-offset-background" type="button">
                        稍后完善
                    </button>
</div>
</form>
<!-- Privacy Note -->
<div class="flex items-start gap-2 pt-4 border-t border-quiet-border">
<span class="material-symbols-outlined text-tertiary text-[18px] mt-0.5">lock</span>
<p class="font-supporting-text text-[12px] leading-relaxed text-on-surface-variant">
                    你的数据仅对家庭成员私密可见，我们严格保护隐私。
                </p>
</div>
</div>
</main>
<!-- State Reference Strip (Hidden by default, shown for reference as requested) -->
<div class="fixed bottom-0 left-0 right-0 bg-inverse-surface text-inverse-on-surface p-4 flex flex-col gap-2 opacity-50 pointer-events-none z-50">
<p class="text-xs font-mono uppercase text-inverse-primary font-bold">UI States Reference</p>
<div class="flex gap-4 text-sm font-supporting-text">
<span>[Submitting]: 正在提交...</span>
<span class="text-[#ffb4ab]">[Error]: 姓名不能为空</span>
<span>[Network]: 网络连接失败 <button class="underline text-inverse-primary pointer-events-auto">重试</button></span>
</div>
</div>
</body></html>
