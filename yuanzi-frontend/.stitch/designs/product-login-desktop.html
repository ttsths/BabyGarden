<!DOCTYPE html>

<html lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>BabyGarden - 登录</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-bright": "#fdf9f5",
                        "on-surface": "#1c1c19",
                        "on-secondary-container": "#772e24",
                        "surface": "#fdf9f5",
                        "primary-fixed-dim": "#ffb4ab",
                        "primary-fixed": "#ffdad6",
                        "surface-container-highest": "#e5e2de",
                        "surface-container-lowest": "#ffffff",
                        "on-error": "#ffffff",
                        "surface-dim": "#ddd9d6",
                        "inverse-primary": "#ffb4ab",
                        "on-error-container": "#93000a",
                        "surface-container": "#f1ede9",
                        "outline-variant": "#dfbfbb",
                        "secondary-fixed": "#ffdad5",
                        "on-surface-variant": "#58413f",
                        "secondary": "#97463b",
                        "primary-container": "#c84b42",
                        "on-tertiary-fixed": "#00201a",
                        "tertiary": "#346559",
                        "tertiary-fixed": "#b9edde",
                        "secondary-container": "#fe9889",
                        "on-secondary-fixed-variant": "#792f26",
                        "error": "#ba1a1a",
                        "deep-cocoa": "#23110F",
                        "error-container": "#ffdad6",
                        "inverse-surface": "#31302e",
                        "on-tertiary-fixed-variant": "#1d4f44",
                        "on-background": "#1c1c19",
                        "surface-container-low": "#f7f3ef",
                        "on-primary": "#ffffff",
                        "tertiary-fixed-dim": "#9ed1c2",
                        "surface-tint": "#aa352e",
                        "background": "#fdf9f5",
                        "on-secondary": "#ffffff",
                        "quiet-border": "#E7D8D2",
                        "surface-variant": "#e5e2de",
                        "on-secondary-fixed": "#3e0402",
                        "focus-blue": "#2E90FA",
                        "inverse-on-surface": "#f4f0ec",
                        "on-tertiary": "#ffffff",
                        "secondary-fixed-dim": "#ffb4a8",
                        "on-primary-container": "#fffcff",
                        "on-primary-fixed": "#410002",
                        "primary": "#a7332c",
                        "tertiary-container": "#4d7e71",
                        "outline": "#8b716e",
                        "surface-container-high": "#ebe7e4",
                        "on-primary-fixed-variant": "#891d1a",
                        "on-tertiary-container": "#f6fffa",
                        "slate-graphite": "#344054"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "2xl": "1rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "admin-gutter": "8px",
                        "product-gutter": "16px",
                        "product-margin": "24px",
                        "control-min-height": "44px",
                        "admin-margin": "16px",
                        "admin-control-height": "36px"
                    },
                    "fontFamily": {
                        "section-title": ["Noto Sans"],
                        "label-caps": ["Noto Sans"],
                        "product-body": ["Noto Sans"],
                        "supporting-text": ["Noto Sans"],
                        "headline-lg-mobile": ["Noto Sans"],
                        "headline-lg": ["Noto Sans"]
                    },
                    "fontSize": {
                        "section-title": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700" }],
                        "product-body": ["16px", { "lineHeight": "26px", "fontWeight": "400" }],
                        "supporting-text": ["14px", { "lineHeight": "22px", "fontWeight": "400" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
</head>
<body class="min-h-screen bg-surface flex flex-col font-product-body text-product-body text-on-surface antialiased">
<!-- Header -->
<header class="absolute top-0 left-0 w-full p-8 flex items-center gap-2 z-10">
<div class="w-8 h-8 rounded-full bg-primary-fixed-dim flex items-center justify-center text-primary-fixed-variant">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">eco</span>
</div>
<span class="font-section-title text-section-title text-deep-cocoa font-bold tracking-tight">BabyGarden</span>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex items-center justify-center p-6 md:p-12 lg:p-24 relative overflow-hidden">
<!-- Max Width Container -->
<div class="max-w-[1440px] w-full grid grid-cols-1 lg:grid-cols-2 gap-16 lg:gap-24 items-center z-10">
<!-- Left Column: Branding & Illustration -->
<div class="flex flex-col gap-12 max-w-lg hidden lg:flex">
<h1 class="font-headline-lg text-headline-lg text-deep-cocoa leading-tight">
                    守护宝宝成长的<br/>每一步
                </h1>
<div class="relative w-full aspect-square max-w-[400px]">
<img alt="" class="w-full h-full object-contain drop-shadow-sm" src="https://lh3.googleusercontent.com/aida-public/AB6AXuC07TWHz6RKdDZA5zlb40glzy0hEQgGW85eWxKOBGCeXgju2aQ5QXveyuRBSxTSvCNABXLrLXF5lYkJnkK41GPaldyNJlyiwuWND5D14m5mOpPZOi52GIkNsb3K9TnigsRNr1_o-_B1cJyAoMyRfBOr7CJ8eUpbxSgEJ5hFEhR25XRwZpzcxLAKuIV3-PTwLFMj4_w9UBLfJ4Z-mzqE4-DnxfdjQlQ1xtzO5uO1IdeoTGqQa3n_PJSdeaIE6bsP9vRuw079VNtMZ1k"/>
</div>
</div>
<!-- Right Column: Login Card & State Panel -->
<div class="flex flex-col items-center lg:items-start w-full max-w-md mx-auto lg:mx-0">
<!-- Login Card -->
<div class="bg-surface-container-lowest border border-quiet-border rounded-2xl shadow-[0_4px_12px_rgba(35,17,15,0.04)] p-8 w-full flex flex-col gap-8">
<div class="flex flex-col gap-2">
<h2 class="font-headline-lg text-headline-lg text-deep-cocoa">欢迎回到小园子</h2>
<p class="font-product-body text-product-body text-slate-graphite">登录后继续记录宝宝的成长。</p>
</div>
<form class="flex flex-col gap-5">
<!-- Username Input -->
<div class="flex flex-col gap-2">
<label class="font-supporting-text text-supporting-text text-deep-cocoa" for="username">用户名</label>
<input class="h-control-min-height rounded-xl border border-quiet-border px-4 bg-surface-container-lowest text-on-surface focus:outline-none focus:ring-2 focus:ring-focus-blue focus:ring-offset-2 focus:ring-offset-surface-container-lowest transition-shadow" id="username" placeholder="请输入用户名" type="text"/>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-2">
<label class="font-supporting-text text-supporting-text text-deep-cocoa" for="password">密码</label>
<div class="relative">
<input class="w-full h-control-min-height rounded-xl border border-quiet-border pl-4 pr-12 bg-surface-container-lowest text-on-surface focus:outline-none focus:ring-2 focus:ring-focus-blue focus:ring-offset-2 focus:ring-offset-surface-container-lowest transition-shadow" id="password" placeholder="请输入密码" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-3 top-1/2 -translate-y-1/2 w-10 h-10 flex items-center justify-center text-slate-graphite hover:text-deep-cocoa rounded-full transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
</div>
<!-- Primary Button -->
<button class="mt-4 h-control-min-height bg-primary-container text-on-primary rounded-xl font-product-body font-medium hover:bg-primary transition-colors focus:outline-none focus:ring-2 focus:ring-focus-blue focus:ring-offset-2 focus:ring-offset-surface-container-lowest shadow-sm" type="button">
                            登录
                        </button>
</form>
<div class="flex flex-col gap-6 pt-2">
<p class="font-supporting-text text-supporting-text text-slate-graphite text-center">
                            没有账号或忘记密码？请联系管理员。
                        </p>
<!-- Privacy Note -->
<div class="flex items-start gap-3 bg-surface p-4 rounded-xl border border-quiet-border/50">
<span class="material-symbols-outlined text-tertiary mt-0.5" style="font-variation-settings: 'FILL' 1;">shield_lock</span>
<p class="font-supporting-text text-supporting-text text-deep-cocoa">仅家庭成员可查看园子里的记录。</p>
</div>
</div>
</div>
<!-- State Panel (Adjacent demonstration) -->
<div class="mt-8 bg-surface-container-lowest border border-quiet-border rounded-xl p-6 w-full shadow-[0_2px_8px_rgba(35,17,15,0.02)]">
<h3 class="font-supporting-text text-supporting-text font-semibold text-deep-cocoa mb-4 uppercase tracking-wider text-xs">System States Demonstration</h3>
<div class="flex flex-col gap-3">
<!-- Invalid Credentials -->
<div class="flex items-center justify-between p-3 bg-error-container/20 border border-error/20 rounded-lg">
<div class="flex items-center gap-2 text-error">
<span class="material-symbols-outlined text-[18px]">error</span>
<span class="font-supporting-text text-supporting-text text-[13px] font-medium">无效凭据</span>
</div>
<span class="text-[12px] text-slate-graphite">重试输入</span>
</div>
<!-- Account Disabled -->
<div class="flex items-center justify-between p-3 bg-surface-variant/50 border border-outline-variant/50 rounded-lg">
<div class="flex items-center gap-2 text-on-surface-variant">
<span class="material-symbols-outlined text-[18px]">block</span>
<span class="font-supporting-text text-supporting-text text-[13px] font-medium">账号已禁用</span>
</div>
<span class="text-[12px] text-slate-graphite">联系管理员</span>
</div>
<!-- Session Expired -->
<div class="flex items-center justify-between p-3 bg-secondary-container/20 border border-secondary/20 rounded-lg">
<div class="flex items-center gap-2 text-secondary">
<span class="material-symbols-outlined text-[18px]">timer</span>
<span class="font-supporting-text text-supporting-text text-[13px] font-medium">会话已过期</span>
</div>
<span class="text-[12px] text-slate-graphite">重新登录</span>
</div>
</div>
</div>
</div>
</div>
</main>
<script>
        // Simple password visibility toggle for realism
        document.addEventListener('DOMContentLoaded', () => {
            const toggleBtn = document.querySelector('button[aria-label="Toggle password visibility"]');
            const passwordInput = document.getElementById('password');
            const icon = toggleBtn.querySelector('.material-symbols-outlined');

            toggleBtn.addEventListener('click', () => {
                if (passwordInput.type === 'password') {
                    passwordInput.type = 'text';
                    icon.textContent = 'visibility';
                } else {
                    passwordInput.type = 'password';
                    icon.textContent = 'visibility_off';
                }
            });
        });
    </script>
</body></html>
