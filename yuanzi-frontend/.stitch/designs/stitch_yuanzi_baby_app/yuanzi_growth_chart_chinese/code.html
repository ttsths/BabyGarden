<!DOCTYPE html>

<html lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#ff998a",
                        "background-light": "#fffbf7",
                        "background-dark": "#23110f",
                        "mint": "#a2d5c6",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100">
<div class="relative flex h-screen w-full flex-col overflow-x-hidden max-w-md mx-auto bg-background-light dark:bg-background-dark">
<!-- Header -->
<div class="flex items-center p-4 pt-6 justify-between">
<button class="text-slate-900 dark:text-slate-100 flex size-10 items-center justify-center rounded-full hover:bg-primary/10 transition-colors">
<span class="material-symbols-outlined">arrow_back_ios</span>
</button>
<h2 class="text-lg font-bold leading-tight tracking-tight flex-1 text-center pr-10">成长曲线</h2>
</div>
<!-- Toggle Tabs -->
<div class="px-4 py-3">
<div class="flex h-12 items-center justify-center rounded-xl bg-primary/10 p-1">
<label class="flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-lg px-2 has-[:checked]:bg-white has-[:checked]:shadow-sm has-[:checked]:text-primary text-slate-500 text-sm font-semibold transition-all">
<span>体重</span>
<input checked="" class="invisible w-0" name="growth-type" type="radio" value="weight"/>
</label>
<label class="flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-lg px-2 has-[:checked]:bg-white has-[:checked]:shadow-sm has-[:checked]:text-primary text-slate-500 text-sm font-semibold transition-all">
<span>身高</span>
<input class="invisible w-0" name="growth-type" type="radio" value="height"/>
</label>
</div>
</div>
<!-- Main Chart Container -->
<div class="px-4 py-4">
<div class="bg-white dark:bg-slate-800/50 rounded-xl p-6 shadow-sm border border-primary/5">
<div class="flex justify-between items-end mb-6">
<div>
<p class="text-slate-500 text-sm font-medium mb-1">当前体重</p>
<h3 class="text-3xl font-bold text-slate-900 dark:text-white">7.2 <span class="text-lg font-medium">kg</span></h3>
</div>
<div class="text-right">
<span class="inline-flex items-center rounded-full bg-mint/20 px-2 py-1 text-xs font-bold text-teal-700">
                            +15% 自出生
                        </span>
</div>
</div>
<!-- Line Chart Visualization -->
<div class="relative h-48 w-full">
<svg class="w-full h-full" preserveaspectratio="none" viewbox="0 0 400 150">
<!-- Grid Lines -->
<line stroke="#f1f5f9" stroke-width="1" x1="0" x2="400" y1="120" y2="120"></line>
<line stroke="#f1f5f9" stroke-width="1" x1="0" x2="400" y1="80" y2="80"></line>
<line stroke="#f1f5f9" stroke-width="1" x1="0" x2="400" y1="40" y2="40"></line>
<!-- Growth Line (Mint Green) -->
<path d="M0,140 Q40,130 80,110 T160,85 T240,60 T320,40 T400,25" fill="none" stroke="#a2d5c6" stroke-linecap="round" stroke-width="4"></path>
<!-- Data Points -->
<circle cx="80" cy="110" fill="white" r="4" stroke="#a2d5c6" stroke-width="2"></circle>
<circle cx="160" cy="85" fill="white" r="4" stroke="#a2d5c6" stroke-width="2"></circle>
<circle cx="240" cy="60" fill="white" r="4" stroke="#a2d5c6" stroke-width="2"></circle>
<circle cx="320" cy="40" fill="white" r="4" stroke="#a2d5c6" stroke-width="2"></circle>
<circle cx="400" cy="25" fill="#ff998a" r="6"></circle>
</svg>
<div class="flex justify-between mt-4 text-[10px] font-bold text-slate-400 tracking-wider uppercase">
<span>1月</span>
<span>2月</span>
<span>3月</span>
<span>4月</span>
<span>5月</span>
<span>6月</span>
</div>
</div>
</div>
</div>
<!-- Stats Cards Grid -->
<div class="grid grid-cols-2 gap-4 px-4 py-2">
<div class="bg-white dark:bg-slate-800/50 p-5 rounded-xl shadow-sm border border-primary/5">
<div class="flex items-center gap-2 mb-2">
<span class="material-symbols-outlined text-primary text-sm">monitor_weight</span>
<p class="text-xs font-semibold text-slate-500">成长状态</p>
</div>
<p class="text-xl font-bold text-slate-900 dark:text-white">稳步增长</p>
<p class="text-[10px] text-teal-600 mt-1 font-medium">高于同龄 85%</p>
</div>
<div class="bg-white dark:bg-slate-800/50 p-5 rounded-xl shadow-sm border border-primary/5">
<div class="flex items-center gap-2 mb-2">
<span class="material-symbols-outlined text-primary text-sm">leaderboard</span>
<p class="text-xs font-semibold text-slate-500">百分位</p>
</div>
<p class="text-xl font-bold text-slate-900 dark:text-white">75th</p>
<p class="text-[10px] text-primary mt-1 font-medium">处于理想区间</p>
</div>
</div>
<!-- Milestones Row -->
<div class="mt-4">
<div class="px-4 mb-3 flex justify-between items-center">
<h4 class="font-bold text-slate-800 dark:text-slate-200">里程碑徽章</h4>
<button class="text-primary text-xs font-semibold">查看全部</button>
</div>
<div class="flex gap-4 px-4 overflow-x-auto hide-scrollbar pb-6">
<!-- Milestone Card 1 -->
<div class="flex flex-col items-center gap-2 min-w-[80px]">
<div class="size-16 rounded-full bg-primary/10 flex items-center justify-center border-2 border-white shadow-sm">
<span class="material-symbols-outlined text-primary text-3xl">sentiment_satisfied</span>
</div>
<p class="text-[11px] font-bold text-slate-600 text-center">第一次微笑</p>
</div>
<!-- Milestone Card 2 -->
<div class="flex flex-col items-center gap-2 min-w-[80px]">
<div class="size-16 rounded-full bg-mint/10 flex items-center justify-center border-2 border-white shadow-sm">
<span class="material-symbols-outlined text-mint text-3xl">child_care</span>
</div>
<p class="text-[11px] font-bold text-slate-600 text-center">抬头</p>
</div>
<!-- Milestone Card 3 -->
<div class="flex flex-col items-center gap-2 min-w-[80px]">
<div class="size-16 rounded-full bg-amber-100 flex items-center justify-center border-2 border-white shadow-sm">
<span class="material-symbols-outlined text-amber-500 text-3xl">potted_plant</span>
</div>
<p class="text-[11px] font-bold text-slate-600 text-center">翻身</p>
</div>
<!-- Milestone Card 4 -->
<div class="flex flex-col items-center gap-2 min-w-[80px]">
<div class="size-16 rounded-full bg-blue-100 flex items-center justify-center border-2 border-white shadow-sm">
<span class="material-symbols-outlined text-blue-500 text-3xl">nightlight</span>
</div>
<p class="text-[11px] font-bold text-slate-600 text-center">睡整觉</p>
</div>
</div>
</div>
<!-- Spacer for content to show above nav bar -->
<div class="h-24"></div>
<!-- Bottom Navigation Bar -->
<div class="fixed bottom-0 left-0 right-0 max-w-md mx-auto">
<div class="flex gap-2 border-t border-primary/10 bg-white/90 backdrop-blur-md px-4 pb-8 pt-2">
<a class="flex flex-1 flex-col items-center justify-center gap-1 text-slate-400" href="#">
<span class="material-symbols-outlined">home</span>
<p class="text-[10px] font-medium">首页</p>
</a>
<a class="flex flex-1 flex-col items-center justify-center gap-1 text-slate-400" href="#">
<span class="material-symbols-outlined">add_circle</span>
<p class="text-[10px] font-medium">记录</p>
</a>
<a class="flex flex-1 flex-col items-center justify-center gap-1 text-primary" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1">trending_up</span>
<p class="text-[10px] font-bold">成长</p>
</a>
<a class="flex flex-1 flex-col items-center justify-center gap-1 text-slate-400" href="#">
<span class="material-symbols-outlined">person</span>
<p class="text-[10px] font-medium">我的</p>
</a>
</div>
</div>
</div>
</body></html>
