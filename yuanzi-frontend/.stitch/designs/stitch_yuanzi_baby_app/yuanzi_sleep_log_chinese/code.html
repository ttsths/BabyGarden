<html lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#FF9A8B",
            "background-light": "#FFFBF7",
            "background-dark": "#1a1614",
            "mint": "#E7F3EB",
            "mint-text": "#4e9767",
            "coral-soft": "#FFEEEB"
          },
          fontFamily: {
            "display": ["Plus Jakarta Sans", "system-ui", "sans-serif"]
          },
          borderRadius: {
            "DEFAULT": "0.5rem",
            "lg": "1rem",
            "xl": "1.5rem",
            "full": "9999px"
          },
        },
      },
    }
  </script>
<style>
    body {
      font-family: 'Plus Jakarta Sans', 'Noto Sans SC', sans-serif;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .material-symbols-filled {
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen font-display">
<!-- Main Container (Mobile Form Factor) -->
<div class="relative flex min-h-screen w-full max-w-[430px] mx-auto flex-col bg-background-light dark:bg-background-dark shadow-2xl overflow-x-hidden">
<!-- Header -->
<header class="sticky top-0 z-10 flex items-center justify-between px-4 py-4 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-md">
<button class="flex h-10 w-10 items-center justify-center rounded-full bg-white dark:bg-slate-800 shadow-sm border border-slate-100 dark:border-slate-700">
<span class="material-symbols-outlined text-slate-600 dark:text-slate-300">arrow_back_ios_new</span>
</button>
<h1 class="text-xl font-bold tracking-tight text-slate-800 dark:text-slate-100">睡觉记录</h1>
<button class="flex h-10 w-10 items-center justify-center">
<span class="material-symbols-outlined text-slate-600 dark:text-slate-300">more_horiz</span>
</button>
</header>
<!-- Today's Summary Card -->
<section class="px-4 pt-2 pb-6">
<div class="relative overflow-hidden rounded-xl bg-white dark:bg-slate-800 p-6 shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-coral-soft dark:border-slate-700">
<!-- Background Decoration -->
<div class="absolute -right-10 -top-10 h-32 w-32 rounded-full bg-primary/10 blur-2xl"></div>
<div class="relative z-10 flex flex-col gap-4">
<div class="flex items-center justify-between">
<h2 class="text-lg font-bold text-slate-800 dark:text-slate-100">今日睡眠</h2>
<span class="rounded-full bg-primary/20 px-3 py-1 text-xs font-semibold text-primary">10月24日</span>
</div>
<div class="grid grid-cols-2 gap-4">
<div class="flex flex-col gap-1 rounded-lg bg-coral-soft/50 dark:bg-slate-700/50 p-3">
<span class="text-xs text-slate-500 dark:text-slate-400">总计时长</span>
<p class="text-2xl font-bold text-primary">12<span class="text-sm ml-1">h</span></p>
</div>
<div class="flex flex-col gap-1 rounded-lg bg-mint/50 dark:bg-slate-700/50 p-3">
<span class="text-xs text-slate-500 dark:text-slate-400">小睡次数</span>
<p class="text-2xl font-bold text-mint-text">5<span class="text-sm ml-1">次</span></p>
</div>
</div>
<div class="mt-2 h-2 w-full overflow-hidden rounded-full bg-slate-100 dark:bg-slate-700">
<div class="h-full w-[75%] rounded-full bg-gradient-to-r from-primary to-primary/60"></div>
</div>
<p class="text-xs text-slate-400 dark:text-slate-500 text-center">距离目标睡眠还差 2 小时</p>
</div>
</div>
</section>
<!-- Timeline Title -->
<div class="flex items-center justify-between px-6 pb-4">
<h3 class="text-lg font-bold text-slate-800 dark:text-slate-100">睡眠详情</h3>
<button class="text-sm font-medium text-primary flex items-center gap-1">
        查看报告 <span class="material-symbols-outlined text-sm">trending_up</span>
</button>
</div>
<!-- Timeline List -->
<div class="flex-1 px-6 space-y-0">
<!-- Session 1 -->
<div class="relative flex gap-4 pb-8">
<!-- Connector -->
<div class="absolute left-[19px] top-10 bottom-0 w-[2px] bg-slate-100 dark:bg-slate-800"></div>
<!-- Icon -->
<div class="relative z-10 flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-primary shadow-sm shadow-primary/40">
<span class="material-symbols-outlined text-white text-[20px]">bedtime</span>
</div>
<!-- Content -->
<div class="flex flex-1 flex-col gap-2 pt-1">
<div class="flex items-center justify-between">
<p class="text-base font-bold text-slate-800 dark:text-slate-100">21:00 - 07:00</p>
<span class="text-sm font-medium text-slate-400">10h</span>
</div>
<div class="flex items-center gap-2">
<span class="inline-flex items-center rounded-full bg-mint px-2.5 py-0.5 text-xs font-medium text-mint-text">
<span class="mr-1 h-1.5 w-1.5 rounded-full bg-mint-text"></span>
              安稳
            </span>
<span class="text-xs text-slate-400">长觉</span>
</div>
</div>
</div>
<!-- Session 2 -->
<div class="relative flex gap-4 pb-8">
<div class="absolute left-[19px] top-10 bottom-0 w-[2px] bg-slate-100 dark:bg-slate-800"></div>
<div class="relative z-10 flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-coral-soft border border-primary/20">
<span class="material-symbols-outlined text-primary text-[20px]">sunny</span>
</div>
<div class="flex flex-1 flex-col gap-2 pt-1">
<div class="flex items-center justify-between">
<p class="text-base font-bold text-slate-800 dark:text-slate-100">14:00 - 15:30</p>
<span class="text-sm font-medium text-slate-400">1.5h</span>
</div>
<div class="flex items-center gap-2">
<span class="inline-flex items-center rounded-full bg-amber-50 px-2.5 py-0.5 text-xs font-medium text-amber-600">
<span class="mr-1 h-1.5 w-1.5 rounded-full bg-amber-500"></span>
              易醒
            </span>
<span class="text-xs text-slate-400">午睡</span>
</div>
</div>
</div>
<!-- Session 3 -->
<div class="relative flex gap-4 pb-8">
<div class="absolute left-[19px] top-10 bottom-0 w-[2px] bg-slate-100 dark:bg-slate-800"></div>
<div class="relative z-10 flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-coral-soft border border-primary/20">
<span class="material-symbols-outlined text-primary text-[20px]">child_care</span>
</div>
<div class="flex flex-1 flex-col gap-2 pt-1">
<div class="flex items-center justify-between">
<p class="text-base font-bold text-slate-800 dark:text-slate-100">10:30 - 11:00</p>
<span class="text-sm font-medium text-slate-400">0.5h</span>
</div>
<div class="flex items-center gap-2">
<span class="inline-flex items-center rounded-full bg-mint px-2.5 py-0.5 text-xs font-medium text-mint-text">
<span class="mr-1 h-1.5 w-1.5 rounded-full bg-mint-text"></span>
              安稳
            </span>
<span class="text-xs text-slate-400">短觉</span>
</div>
</div>
</div>
<!-- Session 4 (Just started icon variant) -->
<div class="relative flex gap-4 pb-8">
<div class="relative z-10 flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-slate-100 dark:bg-slate-800">
<span class="material-symbols-outlined text-slate-400 text-[20px]">more_time</span>
</div>
<div class="flex flex-1 flex-col gap-2 pt-1">
<div class="flex items-center justify-between">
<p class="text-base font-bold text-slate-400">等待记录...</p>
</div>
</div>
</div>
</div>
<!-- Floating Action Button -->
<div class="fixed bottom-24 left-1/2 -translate-x-1/2 z-20">
<button class="flex h-14 w-14 items-center justify-center rounded-full bg-primary text-white shadow-lg shadow-primary/30 active:scale-95 transition-transform">
<span class="material-symbols-outlined text-3xl">add</span>
</button>
</div>
<!-- Bottom Navigation Bar -->
<nav class="sticky bottom-0 z-10 flex w-full border-t border-slate-100 dark:border-slate-800 bg-white/90 dark:bg-slate-900/90 backdrop-blur-lg px-6 pb-8 pt-3">
<div class="flex w-full items-center justify-between">
<a class="flex flex-col items-center gap-1" href="#">
<span class="material-symbols-outlined text-slate-400 dark:text-slate-500">home</span>
<span class="text-[10px] font-medium text-slate-400 dark:text-slate-500">首页</span>
</a>
<a class="flex flex-col items-center gap-1" href="#">
<span class="material-symbols-outlined text-primary font-variation-settings-fill-1">event_note</span>
<span class="text-[10px] font-medium text-primary">记录</span>
</a>
<a class="flex flex-col items-center gap-1" href="#">
<span class="material-symbols-outlined text-slate-400 dark:text-slate-500">insights</span>
<span class="text-[10px] font-medium text-slate-400 dark:text-slate-500">分析</span>
</a>
<a class="flex flex-col items-center gap-1" href="#">
<span class="material-symbols-outlined text-slate-400 dark:text-slate-500">person</span>
<span class="text-[10px] font-medium text-slate-400 dark:text-slate-500">我的</span>
</a>
</div>
</nav>
</div>
</body></html>
